{% extends "base.html" %}
{% block content %}
  <div class="form-container">
    <form action="">
      <p>Welcome</p>
      <p>
        <input type="text"
               name="username"
               placeholder="username"
               class="input-field" />
      </p>
      <p>
        <input type="text"
               name="password"
               placeholder="password"
               class="input-field" />
      </p>
      <p>
        <input type="submit" value="Login" class="btn btn-login" />
        <p>
          Don't have one?
          <a href="/Register">Create an account</a>
        </p>
      </p>
    </form>
  </div>
{% endblock %}
