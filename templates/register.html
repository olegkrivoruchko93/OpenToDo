<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | OpenToDo</title>
    <script>
        (function () {
            var k = "opentodo-theme";
            var v = localStorage.getItem(k);
            if (v !== "default" && v !== "warm" && v !== "dark") v = "default";
            document.documentElement.setAttribute("data-theme", v);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container auth-container">
    <h1>Регистрация в OpenToDo</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flash-list">
                {% for message in messages %}
                    <li class="flash-message">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form class="auth-form" action="{{ url_for('register') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Создать аккаунт</button>
    </form>

    <p class="auth-hint">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</main>
</body>
</html>
