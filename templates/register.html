<!doctype html>
<html lang="ru">
<head>
{% set auth_title = "Регистрация" %}
{% include "partials/_auth_head.html" %}
</head>
<body class="auth-page">
<div class="auth-layout">
    <aside class="auth-brand-panel">
        <div class="auth-brand-inner">
            {% from "partials/_icons.html" import icon %}
            <span class="auth-brand-logo">{{ icon('logo', '', 36) }}</span>
            <h1 class="auth-brand-title">OpenToDo</h1>
            <p class="auth-brand-tagline">Простой таск-менеджер без лишнего</p>
        </div>
    </aside>
    <main class="auth-form-panel">
        <div class="auth-container">
            <h2 class="auth-form-title">Регистрация</h2>
            <p class="auth-form-subtitle">Создайте аккаунт за минуту</p>

            <form class="auth-form" action="{{ url_for('auth.register') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label class="form-field">
                    <span>Логин</span>
                    <input type="text" name="username" placeholder="Придумайте логин" required autocomplete="username">
                </label>
                <label class="form-field">
                    <span>Пароль</span>
                    <input type="password" name="password" placeholder="Придумайте пароль" required autocomplete="new-password">
                </label>
                <button type="submit">Создать аккаунт</button>
            </form>

            <p class="auth-hint">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
        </div>
    </main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
    const FLASH_MESSAGES = {{ get_flashed_messages()|tojson }};
    const toastEl = document.getElementById("toast");
    let toastTimeoutId;

    function showToast(message) {
        if (!toastEl) {
            return;
        }
        clearTimeout(toastTimeoutId);
        toastEl.textContent = message;
        toastEl.classList.remove("hidden");
        toastTimeoutId = window.setTimeout(() => {
            toastEl.classList.add("hidden");
        }, 5000);
    }

    if (FLASH_MESSAGES.length) {
        showToast(FLASH_MESSAGES.join(" • "));
    }
</script>
</body>
</html>
