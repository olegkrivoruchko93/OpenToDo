<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | OpenToDo</title>
    <script>
        (function () {
            var k = "opentodo-theme";
            var v = localStorage.getItem(k);
            var themes = ["default", "warm", "dark", "ocean", "forest", "violet"];
            if (themes.indexOf(v) === -1) v = "default";
            document.documentElement.setAttribute("data-theme", v);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container auth-container">
    <h1>Регистрация в OpenToDo</h1>

    <form class="auth-form" action="{{ url_for('auth.register') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Создать аккаунт</button>
    </form>

    <p class="auth-hint">Уже есть аккаунт? <a href="{{ url_for('auth.login') }}">Войти</a></p>
</main>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
    const FLASH_MESSAGES = {{ get_flashed_messages()|tojson }};
    const toastEl = document.getElementById("toast");
    let toastTimeoutId;

    function showToast(message) {
        if (!toastEl) {
            return;
        }
        clearTimeout(toastTimeoutId);
        toastEl.textContent = message;
        toastEl.classList.remove("hidden");
        toastTimeoutId = window.setTimeout(() => {
            toastEl.classList.add("hidden");
        }, 5000);
    }

    if (FLASH_MESSAGES.length) {
        showToast(FLASH_MESSAGES.join(" • "));
    }
</script>
</body>
</html>
