{% from "partials/_icons.html" import icon %}
<div id="task-edit-modal-overlay" class="modal-overlay hidden">
    <section class="modal-panel task-edit-modal-panel">
        <div class="modal-head">
            <h2>Изменить задачу</h2>
            <button id="close-task-edit-modal" class="icon-btn" type="button" aria-label="Закрыть">{{ icon('close', '', 16) }}</button>
        </div>
        <form id="task-edit-form" class="add-form" action="{{ url_for('tasks.edit_task', task_id=0, view=current_view, project_id=selected_project_id, tag_id=selected_tag_id, q=search_arg) }}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="view" value="{{ current_view }}">
            <input type="hidden" name="filter_project_id" value="{{ selected_project_id if selected_project_id else '' }}">
            <input type="hidden" name="tag_id" value="{{ selected_tag_id if selected_tag_id else '' }}">
            <input type="hidden" name="q" value="{{ search_query }}">
            <div class="task-edit-layout">
                <div class="task-edit-main">
                    <label class="form-field" for="task-edit-title-input">
                        <span>Название</span>
                        <input id="task-edit-title-input" type="text" name="title" placeholder="Название задачи..." required>
                    </label>
                    <label class="form-field" for="task-edit-description-input">
                        <span>Описание</span>
                        <textarea id="task-edit-description-input" name="description" rows="1" placeholder="Описание задачи (необязательно)"></textarea>
                    </label>
                    <div class="checklist-builder-title">
                        <span>Чек-лист <small id="task-edit-checklist-progress" class="checklist-progress"></small></span>
                    </div>
                    <div class="checklist-builder">
                        <div id="task-edit-checklist-items" class="checklist-builder-items"></div>
                    </div>
                    <div class="attachments-builder">
                        <div class="attachments-builder-head">
                            <span>Вложения</span>
                        </div>
                        <div id="task-edit-attachments" class="attachment-list"></div>
                        <label class="file-dropzone">
                            <input id="task-edit-new-attachments-input" class="file-dropzone-input" type="file" name="attachments[]" multiple>
                            <span class="file-dropzone-title">Прикрепить файлы</span>
                            <span class="file-dropzone-note">или перетащите сюда, до 10 MB каждый</span>
                        </label>
                    </div>
                </div>
                <aside class="task-edit-sidebar" aria-label="Параметры задачи">
                    <h3 class="task-edit-sidebar-title">Параметры</h3>
                    <label class="form-field" for="task-edit-project-input">
                        <span>Проект</span>
                        <select id="task-edit-project-input" name="project_id">
                            <option value="">Без проекта</option>
                            {% for project in projects %}
                                <option value="{{ project.id }}">{{ project_icon_map.get(project.icon, "📁") }} {{ project.name }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <label class="form-field" for="task-edit-due-date-input">
                        <span>Дата</span>
                        <input id="task-edit-due-date-input" type="datetime-local" name="due_at" aria-label="Дедлайн задачи">
                    </label>
                    <label class="form-field" for="task-edit-recurrence-input">
                        <span>Повторять</span>
                        <select id="task-edit-recurrence-input" name="recurrence">
                            {% for recurrence_value, recurrence_label in task_recurrence_options %}
                                <option value="{{ recurrence_value }}">{{ recurrence_label }}</option>
                            {% endfor %}
                        </select>
                    </label>
                    <div class="form-field priority-picker-field">
                        <span id="task-edit-priority-label">Приоритет</span>
                        <input id="task-edit-priority-input" type="hidden" name="priority" value="medium">
                        <details class="priority-dropdown" data-priority-dropdown="task-edit-priority-input">
                            <summary class="priority-dropdown-trigger" aria-labelledby="task-edit-priority-label">
                                <span class="priority-selected priority-option-medium" data-priority-selected-for="task-edit-priority-input">
                                    <span class="priority-option-icon" aria-hidden="true">!</span>
                                    <span>Средний приоритет</span>
                                </span>
                            </summary>
                            <div class="priority-picker" role="radiogroup" aria-labelledby="task-edit-priority-label">
                                {% for priority_value, priority_label in task_priority_options %}
                                    <button
                                        type="button"
                                        class="priority-option priority-option-{{ priority_value }} {% if priority_value == 'medium' %}active{% endif %}"
                                        data-priority-option="{{ priority_value }}"
                                        data-priority-target="task-edit-priority-input"
                                        aria-pressed="{{ 'true' if priority_value == 'medium' else 'false' }}"
                                    >
                                        <span class="priority-option-icon" aria-hidden="true">!</span>
                                        <span>{{ priority_label }} приоритет</span>
                                    </button>
                                {% endfor %}
                            </div>
                        </details>
                    </div>
                    <div class="form-field task-tag-picker-field">
                        <span id="task-edit-tags-label">Метки</span>
                        <input id="task-edit-tags-input" type="hidden" name="tag_names">
                        <div
                            id="task-edit-tags-picker"
                            class="tag-picker"
                            role="combobox"
                            aria-labelledby="task-edit-tags-label"
                            aria-haspopup="listbox"
                            aria-expanded="false"
                        >
                            <div id="task-edit-tags-selected" class="tag-picker-selected"></div>
                            <input id="task-edit-tags-search" class="tag-picker-search" type="text" placeholder="Добавить метку" autocomplete="off">
                        </div>
                    </div>
                    <div id="task-edit-tags-suggestions" class="tag-picker-menu hidden" role="listbox"></div>
                </aside>
            </div>
            <div class="modal-actions task-edit-actions">
                <div class="task-edit-actions-primary">
                    <button id="task-edit-save-btn" type="button">Сохранить</button>
                    <button class="button-secondary" type="button" data-modal-cancel="task-edit">Отмена</button>
                </div>
                <button id="task-edit-delete-btn" type="submit" class="danger task-edit-delete-action" form="task-edit-delete-form">Удалить</button>
            </div>
        </form>
        <form id="task-edit-delete-form" action="{{ url_for('tasks.delete_task', task_id=0, view=current_view, project_id=selected_project_id, tag_id=selected_tag_id, q=search_arg) }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="view" value="{{ current_view }}">
            <input type="hidden" name="project_id" value="{{ selected_project_id if selected_project_id else '' }}">
            <input type="hidden" name="tag_id" value="{{ selected_tag_id if selected_tag_id else '' }}">
            <input type="hidden" name="q" value="{{ search_query }}">
        </form>
    </section>
</div>
