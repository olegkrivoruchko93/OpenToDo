{% from "partials/_icons.html" import icon %}
<div id="project-modal-overlay" class="modal-overlay hidden">
    <section class="modal-panel modal-panel-compact">
        <div class="modal-head">
            <h2>Новый проект</h2>
            <button id="close-project-modal" class="icon-btn" type="button" aria-label="Закрыть">{{ icon('close', '', 16) }}</button>
        </div>
        <form class="project-form" action="{{ url_for('projects.add_project') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="view" value="{{ current_view }}">
            <input type="hidden" name="filter_project_id" value="{{ selected_project_id if selected_project_id else '' }}">
            <input type="hidden" name="tag_id" value="{{ selected_tag_id if selected_tag_id else '' }}">
            <input type="hidden" name="q" value="{{ search_query }}">
            <input id="project-name-input" type="text" name="name" placeholder="Название проекта..." required>
            <select name="icon">
                {% for icon_key, icon_label in project_icon_options %}
                    <option value="{{ icon_key }}">{{ icon_label }}</option>
                {% endfor %}
            </select>
            <button type="submit">Создать</button>
        </form>
    </section>
</div>
