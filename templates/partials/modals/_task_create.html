{% from "partials/_icons.html" import icon %}
<div id="task-modal-overlay" class="modal-overlay hidden">
    <section class="modal-panel">
        <div class="modal-head">
            <h2>Новая задача</h2>
            <button id="close-task-modal" class="icon-btn" type="button" aria-label="Закрыть">{{ icon('close', '', 16) }}</button>
        </div>
        <form class="add-form" action="{{ url_for('tasks.add_task', view=current_view, project_id=selected_project_id, tag_id=selected_tag_id, q=search_arg) }}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="view" value="{{ current_view }}">
            <input type="hidden" name="tag_id" value="{{ selected_tag_id if selected_tag_id else '' }}">
            <input type="hidden" name="q" value="{{ search_query }}">
            <label class="form-field" for="task-title-input">
                <span>Название</span>
                <input id="task-title-input" type="text" name="title" placeholder="Новая задача..." required>
            </label>
            <label class="form-field" for="task-description-input">
                <span>Описание</span>
                <textarea id="task-description-input" name="description" placeholder="Описание задачи (необязательно)"></textarea>
            </label>
            <label class="form-field" for="task-due-date-input">
                <span>Дата и время</span>
                <input id="task-due-date-input" type="datetime-local" name="due_at" aria-label="Дедлайн задачи">
            </label>
            <label class="form-field" for="task-recurrence-input">
                <span>Повторять</span>
                <select id="task-recurrence-input" name="recurrence">
                    {% for recurrence_value, recurrence_label in task_recurrence_options %}
                        <option value="{{ recurrence_value }}">{{ recurrence_label }}</option>
                    {% endfor %}
                </select>
            </label>
            <div class="form-field priority-picker-field">
                <span id="task-priority-label">Приоритет</span>
                <input id="task-priority-input" type="hidden" name="priority" value="medium">
                <details class="priority-dropdown" data-priority-dropdown="task-priority-input">
                    <summary class="priority-dropdown-trigger" aria-labelledby="task-priority-label">
                        <span class="priority-selected priority-option-medium" data-priority-selected-for="task-priority-input">
                            <span class="priority-option-icon" aria-hidden="true">!</span>
                            <span>Средний приоритет</span>
                        </span>
                    </summary>
                    <div class="priority-picker" role="radiogroup" aria-labelledby="task-priority-label">
                        {% for priority_value, priority_label in task_priority_options %}
                            <button
                                type="button"
                                class="priority-option priority-option-{{ priority_value }} {% if priority_value == 'medium' %}active{% endif %}"
                                data-priority-option="{{ priority_value }}"
                                data-priority-target="task-priority-input"
                                aria-pressed="{{ 'true' if priority_value == 'medium' else 'false' }}"
                            >
                                <span class="priority-option-icon" aria-hidden="true">!</span>
                                <span>{{ priority_label }} приоритет</span>
                            </button>
                        {% endfor %}
                    </div>
                </details>
            </div>
            <div class="checklist-builder-title">
                <span>Чек-лист</span>
            </div>
            <div id="task-checklist-builder" class="checklist-builder">
                <div id="task-checklist-items" class="checklist-builder-items"></div>
            </div>
            <label class="form-field" for="task-project-input">
                <span>Проект</span>
                <select id="task-project-input" name="project_id">
                    <option value="">Без проекта</option>
                    {% for project in projects %}
                        <option value="{{ project.id }}" {% if selected_project_id == project.id %}selected{% endif %}>{{ project_icon_map.get(project.icon, "📁") }} {{ project.name }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="form-field" for="task-tags-input">
                <span>Метки</span>
                <input id="task-tags-input" type="text" name="tag_names" placeholder="Метки через запятую, например: работа, срочно">
            </label>
            <div id="task-tags-suggestions" class="tag-suggestions hidden"></div>
            <div class="attachments-builder">
                <div class="attachments-builder-head">
                    <span>Вложения</span>
                </div>
                <label class="file-dropzone">
                    <input class="file-dropzone-input" type="file" name="attachments[]" multiple>
                    <span class="file-dropzone-title">Прикрепить файлы</span>
                    <span class="file-dropzone-note">или перетащите сюда, до 10 MB каждый</span>
                </label>
            </div>
            <div class="modal-actions">
                <button type="submit">Создать</button>
                <button class="button-secondary" type="button" data-modal-cancel="task">Отмена</button>
            </div>
        </form>
    </section>
</div>
