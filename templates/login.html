<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | OpenToDo</title>
    <script>
        (function () {
            var k = "opentodo-theme";
            var v = localStorage.getItem(k);
            var themes = ["default", "warm", "dark", "ocean", "forest", "violet"];
            if (themes.indexOf(v) === -1) v = "default";
            document.documentElement.setAttribute("data-theme", v);
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container auth-container">
    <h1>Вход в OpenToDo</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul class="flash-list">
                {% for message in messages %}
                    <li class="flash-message">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form class="auth-form" action="{{ url_for('auth.login') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>

    <p class="auth-hint">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
</main>
</body>
</html>
