{% extends "base.html" %}
{% block content %}
  <div class="login-page">
    <div class="login-container">
      <form id="auth-form">
        <h2>Добро пожаловать</h2>
        <div class="input-group">
          <input type="text" id="username" name="username" placeholder="логин" class="input-field" />
        </div>
        <div class="input-group">
          <input type="password" id="password" name="password" placeholder="пароль" class="input-field" />
        </div>
        <div class="button-group">
          <button type="button" data-action="login" class="btn-login">Войти</button>
          <button type="button" data-action="register" class="btn-register">Создать</button>
        </div>
        <p class="message-container">
          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              <div class="flash-messages">
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
              </div>
            {% endif %}
          {% endwith %}
        </p>
      </form>
    </div>
  </div>
  <script>
    document.getElementById("auth-form").addEventListener('click', function(e) {
        const button = e.target.closest('[data-action]');
        if (button) {
            const action = button.getAttribute('data-action');
            let form = document.getElementById("auth-form");

            if (action === 'login') {
                form.action = "{{ url_for('login') }}";
                form.method = "post";
            } else if (action === 'register') {
                form.action = "{{ url_for('register') }}";
                form.method = "post";
            }
            form.submit();
        }
    });
  </script>
{% endblock %}
