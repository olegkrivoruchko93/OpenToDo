{% for task in tasks %}
    <div class="task-item-container{% if task.completed %} completed{% endif %}">
        <div class="checkbox-wrapper">
            <input type="checkbox"
                   class="task-checkbox"
                   name="task_checked"
                   data-task-id="{{ task.id }}"
                   {% if task.completed %}checked{% endif %}>
        </div>
        <div data-task-id="{{ task.id }}"
             class="task-item">
            <span>
                <p>{{ task.title }}</p>
                <div>
                    <p class="task-meta">
                        {{ task.due_date.strftime("%Y-%m-%d %H:%M") if task.due_date else '' }} /
                        {% if task.project %}
                            {{ task.project.title }}
                        {% else %}
                            No Project
                        {% endif %}
                    </p>
                </div>
            </span>
        </div>
        <form action="{{ url_for('delete', task_id=task.id) }}"
              method="post"
              class="delete-form"
              onsubmit="return confirm('Delete this task?')">
            <button type="submit" title="Delete">✕</button>
        </form>
    </div>
{% endfor %}
{% if not tasks %}
    <p class="empty-state">No task, nice!</p>
{% endif %}
